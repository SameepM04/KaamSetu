name: kaamsetu
description: A premium hyperlocal daily-wage job connect experience.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2

  # Image Handling
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # Permissions
  permission_handler: ^11.3.1

  # Local persistence (used by the Fake OTP dev-mode session — see
  # lib/config/dev_config.dart)
  shared_preferences: ^2.3.2

  # Animations
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/splash/
    - assets/onboarding_two/
    - assets/role_selection/
    - assets/avatars/
    - assets/icons/jobs/
    - assets/images/workers/
    - assets/images/household/