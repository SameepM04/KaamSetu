name: kaamsetu
description: A premium hyperlocal daily-wage job connect experience.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Typography
  google_fonts: ^6.2.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2

  # Image Handling
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # Permissions
  permission_handler: ^11.3.1

  # Local persistence (used by the Fake OTP dev-mode session — see
  # lib/config/dev_config.dart)
  shared_preferences: ^2.3.2

  # Opens external apps/browser (used by MapNavigationService for
  # "open in Google Maps" directions — see lib/services/map_navigation_service.dart)
  url_launcher: ^6.3.1

  # Animations
  flutter_animate: ^4.5.2
  lottie: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/splash/
    - assets/onboarding_two/
    - assets/role_selection/
    - assets/avatars/
    - assets/icons/jobs/
    - assets/images/workers/
    - assets/images/household/
    - assets/lottie/success_check.lottie

# ---------------------------------------------------------------------------
# App launcher icon — KaamSetu blue/orange heart + "K" symbol only (no
# wordmark/tagline, per branding spec: those become unreadable at launcher
# size). Source is the existing assets/branding/ logo, padded onto a square
# transparent canvas (kaamsetu_icon_source.png) so flutter_launcher_icons
# doesn't stretch or crop the non-square original.
#
# Run after editing:
#   dart run flutter_launcher_icons
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/kaamsetu_icon_source.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/kaamsetu_icon_source(1).png"
  remove_alpha_ios: false